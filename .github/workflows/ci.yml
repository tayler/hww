name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The reading GUI. An explicit feature, never `--all-features`: that would silently opt into
  # whatever anyone adds later, which is the opposite of the auditability this client is for.
  #
  # No apt packages, deliberately. Every native library in this graph is opened at runtime
  # rather than linked at build time — winit reaches X11 through `x11-dl` and keyboards
  # through `xkbcommon-dl`, `wayland-dlopen` covers Wayland (which is why `winit` is a direct
  # dependency), and wgpu loads Vulkan and EGL the same way. Add a package only if a build
  # actually fails for want of it, and say here which one and why: an apt list nobody can
  # justify is how CI accretes.
  #
  # Linux only for now. Add a compile-only macOS/Windows matrix when either platform gains a
  # user; until then its cost would guard platforms nobody runs. No test may call
  # `eframe::run_native`.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

      - name: Test
        run: cargo test --locked --features gui

  # A fixed older userspace sets the binary's glibc floor. This job follows both test jobs and
  # exists only for a push to main, so pull requests prove the source without publishing it.
  package:
    name: Ubuntu package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/build-deb

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # Stable tags build independently from the development artifact. The runner pins the package's
  # glibc floor; the local action fails if GitHub moves it away from Ubuntu 22.04 / glibc 2.35.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, gui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag is not stable SemVer: %s\n' "$TAG" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$TAG")" != tag ]]; then
            printf 'release tag is not annotated: %s\n' "$TAG" >&2
            exit 1
          fi
          version=${TAG#v}
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$version" != "$cargo_version" ]]; then
            printf 'tag version %s does not match Cargo.toml version %s\n' \
              "$version" "$cargo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Verify commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest Debian package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/SHA256SUMS \
            --draft \
            --generate-notes \
            --title "hww $VERSION" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
