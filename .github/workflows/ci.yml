name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The reading GUI. An explicit feature, never `--all-features`: that would silently opt into
  # whatever anyone adds later, which is the opposite of the auditability this client is for.
  #
  # No apt packages, deliberately. Every native library in this graph is opened at runtime
  # rather than linked at build time — winit reaches X11 through `x11-dl` and keyboards
  # through `xkbcommon-dl`, `wayland-dlopen` covers Wayland (which is why `winit` is a direct
  # dependency), and wgpu loads Vulkan and EGL the same way. Add a package only if a build
  # actually fails for want of it, and say here which one and why: an apt list nobody can
  # justify is how CI accretes.
  #
  # Linux only for now. Add a compile-only macOS/Windows matrix when either platform gains a
  # user; until then its cost would guard platforms nobody runs. No test may call
  # `eframe::run_native`.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Clippy
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

      - name: Test
        run: cargo test --locked --features gui

  # A fixed older userspace sets the binary's glibc floor. This job follows both test jobs and
  # exists only for a push to main, so pull requests prove the source without publishing it.
  package:
    name: Ubuntu package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, gui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary
        run: cargo build --locked --release --features gui --bin hww

      - name: Build Debian package
        run: packaging/build-deb.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Install Debian package
        run: |
          sudo apt install --yes ./dist/*.deb
          test "$(command -v hww)" = /usr/bin/hww
          grep -Fx 'Icon=hww' /usr/share/applications/hww.desktop
          grep -Fx 'StartupWMClass=hww' /usr/share/applications/hww.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/hww.png

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hww-linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
