name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  # The reading GUI. An explicit feature, never `--all-features`: that would silently opt into
  # whatever anyone adds later, which is the opposite of the auditability this client is for.
  #
  # No apt packages, deliberately. Every native library in this graph is opened at runtime
  # rather than linked at build time — winit reaches X11 through `x11-dl` and keyboards
  # through `xkbcommon-dl`, `wayland-dlopen` covers Wayland (which is why `winit` is a direct
  # dependency), and wgpu loads Vulkan and EGL the same way. Add a package only if a build
  # actually fails for want of it, and say here which one and why: an apt list nobody can
  # justify is how CI accretes.
  #
  # Windows and macOS are gated in their own jobs below, on the rule this paragraph has always
  # stated: a published binary earns a blocking job, because a platform that ships without a
  # gate is a platform whose breakage is discovered by whoever downloaded it. macOS used to be
  # the counterexample here; it now has a `.dmg` on the releases page and a job to guard it.
  # No test may call `eframe::run_native`.
  gui:
    name: gui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

      - name: Test
        run: cargo test --locked --features gui

  # The other half of the reader's supported surface. Windows earns a blocking job because it
  # earns a published binary; a platform that ships without a gate is a platform whose breakage
  # is discovered by whoever downloaded it.
  #
  # The default-feature pair is not repeated here. What it guards is compile-time absence of
  # the image path and the GUI dependency graph, which is a property of the feature and not of
  # the platform, and the `ci` job already proves it. Windows runners bill at 2x; spending that
  # to re-prove it would buy nothing.
  #
  # NASM is installed because `aws-lc-sys` assembles from source on this target. See the
  # action's own comment for why the vendored prebuilt objects are not the answer.
  gui-windows:
    name: gui (windows)
    runs-on: windows-latest
    # Every script in this file is bash, and the composite actions it calls declare bash for the
    # same reason. Git Bash ships on the runner; leaving the default pwsh in place would mean
    # two shells with two quoting rules describing one build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/setup-nasm

      - name: Clippy
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

      - name: Test
        run: cargo test --locked --features gui

  # The third supported surface, on the same rule as the Windows job above, and with the same
  # default-feature pair left out for the same reason: what that pair guards is a property of
  # the feature and not of the platform, and `ci` already proves it.
  #
  # `macos-latest` is arm64, which is the only architecture this project publishes for. No
  # `defaults.run.shell`: bash is already the default on macOS runners, and the Windows jobs set
  # it only to displace pwsh.
  #
  # Nothing is installed. `aws-lc-sys` takes its perlasm/clang path on Apple targets, so there
  # is no NASM to add, and the AppKit, Metal, and CoreGraphics that winit and wgpu link come
  # with the SDK the runner already carries.
  gui-macos:
    name: gui (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets --locked --features gui -- -D warnings

      - name: Test
        run: cargo test --locked --features gui

  # A fixed older userspace sets the binary's glibc floor. This job follows both test jobs and
  # exists only for a push to main, so pull requests prove the source without publishing it.
  package:
    name: Ubuntu package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, gui, gui-windows, gui-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/build-deb

      - name: Upload Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-linux-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # The Windows half of the same development artifact. Its own job rather than a matrix leg on
  # `package`: the two share no step, since one asserts a glibc floor and installs a .deb and
  # the other asserts a static CRT and runs an .exe.
  package-windows:
    name: Windows package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, gui, gui-windows, gui-macos]
    runs-on: windows-latest
    # Every script in this file is bash, and the composite actions it calls declare bash for the
    # same reason. Git Bash ships on the runner; leaving the default pwsh in place would mean
    # two shells with two quoting rules describing one build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/build-windows

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-windows-amd64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  # The macOS half of the same development artifact, and its own job for the same reason as the
  # Windows one: the three share no step, since one asserts a glibc floor and installs a .deb,
  # one asserts a static CRT and runs an .exe, and this one asserts a deployment floor and an
  # ad-hoc signature and mounts a disk image.
  #
  # Pinned to `macos-15` rather than `macos-latest`, and not for `package`'s reason. The
  # deployment floor here comes from `MACOSX_DEPLOYMENT_TARGET` in `.cargo/config.toml`, not
  # from the host, so this pin buys something narrower: `macos-latest` already moved once this
  # year, and the SDK a published binary was built against should not change without a commit
  # saying so.
  package-macos:
    name: macOS package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, gui, gui-windows, gui-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: ./.github/actions/build-macos

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # The release's Windows archive, built on a Windows runner and handed to `release` through a
  # workflow artifact, because one job cannot run on three operating systems and the release has
  # to be published from one place with one set of checksums.
  #
  # This job takes the version straight off the tag without re-deriving it from Cargo.toml.
  # `release` owns that check and refuses to publish anything if it fails, so the worst a bad
  # tag costs here is a wasted runner, and `release` asserts the filename it downloaded carries
  # the version it verified.
  windows-release-build:
    name: Windows release build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, gui, gui-windows, gui-macos]
    runs-on: windows-latest
    # Every script in this file is bash, and the composite actions it calls declare bash for the
    # same reason. Git Bash ships on the runner; leaving the default pwsh in place would mean
    # two shells with two quoting rules describing one build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # A workflow expression cannot strip the `v`, and the archive name must not carry one:
      # `hww-v0.1.0-...zip` reads as a version called `v0.1.0`.
      - name: Read version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: printf 'version=%s\n' "${TAG#v}" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-windows
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  # The release's disk image, built on a macOS runner and handed to `release` the same way the
  # Windows archive is, and carrying no cargo cache for the same reason `windows-release-build`
  # does not: a release artifact is built from the lockfile and the source in front of it.
  #
  # As with the Windows job, the version comes straight off the tag. `release` owns the check
  # against Cargo.toml and asserts the filename it downloaded carries the version it verified.
  macos-release-build:
    name: macOS release build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, gui, gui-windows, gui-macos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # A workflow expression cannot strip the `v`, and the image name must not carry one:
      # `hww-v0.1.0-...dmg` reads as a version called `v0.1.0`.
      - name: Read version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: printf 'version=%s\n' "${TAG#v}" >>"$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-macos
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hww-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

  # Stable tags build independently from the development artifact. The runner pins the package's
  # glibc floor; the local action fails if GitHub moves it away from Ubuntu 22.04 / glibc 2.35.
  # The Windows archive and the macOS image are built by their own runners and arrive here as
  # workflow artifacts, because one job cannot run on three operating systems and the release has
  # to be published from one place with one set of checksums.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, gui, gui-windows, gui-macos, windows-release-build, macos-release-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release tag is not stable SemVer: %s\n' "$TAG" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$TAG")" != tag ]]; then
            printf 'release tag is not annotated: %s\n' "$TAG" >&2
            exit 1
          fi
          version=${TAG#v}
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$version" != "$cargo_version" ]]; then
            printf 'tag version %s does not match Cargo.toml version %s\n' \
              "$version" "$cargo_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Verify commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - uses: ./.github/actions/build-deb
        with:
          version: ${{ steps.version.outputs.version }}

      # Downloaded with the CLI this job already uses rather than a fourth pinned action. The
      # artifacts were built by `windows-release-build` and `macos-release-build` from the same
      # tag, in the same run.
      - name: Download the Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name hww-windows-amd64 --dir dist

      - name: Download the macOS image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name hww-macos-arm64 --dir dist

      # Those two jobs named their files from an unverified tag; this is the first point where
      # the versions in them meet the version this job checked against Cargo.toml.
      - name: Verify the downloaded versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/hww-${VERSION}-x86_64-windows.zip"
          test -f "dist/hww-${VERSION}-aarch64-macos.dmg"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb *.zip *.dmg >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.zip
            dist/*.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.zip dist/*.dmg dist/SHA256SUMS \
            --draft \
            --generate-notes \
            --title "hww $VERSION" \
            --verify-tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
