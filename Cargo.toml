[package]
name = "hww"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "hww"

[dependencies]
anyhow = "1.0.104"
ego-tree = "0.11.0"
encoding_rs = "0.8.35"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "brotli", "deflate", "charset"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
