[package]
name = "hww"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
default-run = "hww"

[features]
default = []
# The application GUI. Off by default so core tests and local tools keep compile-time absence
# of the image subresource path and the GUI dependency graph.
gui = ["dep:eframe", "dep:image", "dep:winit"]

[dependencies]
anyhow = "1.0.104"
ego-tree = "0.11.0"
encoding_rs = "0.8.35"
# XML for feeds. html5ever reads `<![CDATA[…]]>` as a bogus comment running to the first `>`
# in the payload, which loses a data-dependent amount of every entry silently; see `src/feed.rs`
# for the measurement. `allow_dtd` stays at its default of false, which refuses an entity bomb
# at parse rather than expanding it.
roxmltree = "0.21.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "http2", "gzip", "brotli", "deflate", "charset"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

# Do not declare `egui` directly — `eframe` re-exports it as `eframe::egui`, and a separate
# entry is a version-skew trap. `links` is off (it hands URLs to a system browser via
# `webbrowser`; hww never shells out to Chrome unasked) and `persistence` is off (it pulls
# `ron` in to remember a window size; settings are hand-rolled JSON via `serde_json`).
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "x11", "wayland", "accesskit"], optional = true }
# Direct dep purely to restore winit's defaults — `wayland-dlopen` (no link-time libwayland)
# and `wayland-csd-adwaita` (client-side decorations; without it the window has no titlebar on
# GNOME/Wayland). It cannot be done as `features = ["winit/default"]` on eframe: cargo rejects
# a slash in a dependency's feature list unless eframe re-exports it, which it does not.
winit = { version = "0.30", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"], optional = true }

# The Apple Event that carries a link into a bundled application, and nothing else; see
# `reader::mac_open` for why `argv` is not enough on that platform. A target table rather than
# a feature, because it is not optional on macOS and cannot build anywhere else: `objc2` is
# already in the graph under `winit` on that platform, so this adds an edge rather than a
# dependency. Not gated on `gui` as well, so that a `cargo build` with no window still compiles
# the module the windowed build depends on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# The Windows icon resource only; see `build.rs`. Declared unconditionally rather than under
# `[target.'cfg(windows)'.build-dependencies]`, because which platform a target table is
# matched against for build dependencies is a corner of cargo not worth depending on. The
# script asks `CARGO_CFG_TARGET_OS` instead, which has one meaning.
[build-dependencies]
winresource = "0.1"

# Both binaries need the GUI, so both carry `required-features`. Nothing here prints page text
# to a terminal: untrusted text carrying an escape sequence is an injection surface, so triage
# is headless `--why` on the application and every string it prints goes through
# `render::sanitize_for_terminal` first.
[[bin]]
name = "hww"
path = "src/bin/hww.rs"
required-features = ["gui"]

[[bin]]
name = "hww-shot"
path = "src/bin/shot.rs"
required-features = ["gui"]
