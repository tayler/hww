# The Windows binary links the CRT statically, so hww.exe runs on a clean Windows install with
# no Visual C++ Redistributable to fetch first. It is the same argument as the Debian package's
# pinned glibc floor: a reader whose first act is to send somebody to a download page is not a
# reader that opens.
#
# Scoped to the target rather than set in `build.rustflags`, so it never touches a Linux build
# and applies to a local Windows build exactly as it does in CI. It is not scoped away from
# build scripts: no cargo invocation here passes `--target`, and without one cargo applies the
# host triple's flags to build scripts and proc macros too. `build.rs` is a no-op off Windows
# and links nothing, so a statically linked one costs nothing.
#
# What this cannot survive is a `RUSTFLAGS` environment variable. Cargo drops `target.*.rustflags`
# entirely when that is set, with no warning, and the binary goes back to wanting the
# redistributable README.md promises nobody needs. `.github/actions/build-windows` refuses to
# build with `RUSTFLAGS` set for that reason, and greps the result either way. Dropping the flag
# on purpose means documenting the redistributable in README.md instead.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The macOS floor. Left unset, rustc defaults `aarch64-apple-darwin` to 11.0, but `cc-rs`
# compiles `aws-lc-sys`'s vendored C separately and the linker takes the *maximum* `minos`
# across every object handed to it: one C object built against the runner's SDK default raises
# the whole binary's floor, and nothing in the build says it happened. The artifact would then
# silently require whatever macOS the runner happened to be on.
#
# Unconditional, unlike the rustflags above, and deliberately so rather than by omission.
# Cargo's `[env]` has no per-target form, but the variable is inert on every non-Apple
# toolchain, and it *must* reach build scripts, since `cc-rs` is half the problem. Setting it
# in `.github/actions/build-macos` instead would make a local Mac build differ from CI, which
# is the same argument the `+crt-static` comment above makes for living in this file.
#
# 11.0 is rustc's own floor for this target and the release Metal is available in. It is one
# number in three places: here, `LSMinimumSystemVersion` in `packaging/build-dmg.sh`, and the
# `minos` the build action asserts against the linked binary. If `wgpu`, `objc2`, or
# `aws-lc-sys` ever refuse to build against it, raise all three rather than dropping the pin.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
